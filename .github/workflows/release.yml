name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0 or v1.0.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version format
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Version must match vX.Y.Z or vX.Y.Z-suffix format (got: $VERSION)"
            exit 1
          fi
          # Strip leading 'v' for dotnet/NuGet (which uses X.Y.Z)
          echo "nuget_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag does not exist
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Verify changelog entry
        if: steps.version.outputs.prerelease == 'false'
        run: |
          if ! grep -q "^## ${{ inputs.version }}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${{ inputs.version }}"
            exit 1
          fi

      - name: Extract release notes
        run: |
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            echo "Pre-release build from $(git rev-parse --short HEAD)." > release-notes.md
          else
            awk '/^## ${{ inputs.version }}/{found=1; next} /^## /{if(found) exit} found' CHANGELOG.md > release-notes.md
            if [[ ! -s release-notes.md ]]; then
              echo "::error::Release notes for ${{ inputs.version }} are empty"
              exit 1
            fi
          fi

      - name: Create and push tag
        run: |
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.nuget_version }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Generate release notes props
        run: |
          # Write release notes into an MSBuild file to avoid shell quoting issues
          RELEASE_NOTES=$(cat release-notes.md)
          cat > release-notes.props <<PROPSEOF
          <Project>
            <PropertyGroup>
              <PackageReleaseNotes><![CDATA[$RELEASE_NOTES]]></PackageReleaseNotes>
            </PropertyGroup>
          </Project>
          PROPSEOF

      - name: Pack
        run: |
          dotnet pack src/DotLens/DotLens.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.nuget_version }} \
            -p:CustomAfterMicrosoftCommonTargets=$PWD/release-notes.props

      - name: Create GitHub Release
        run: |
          gh release create "${{ inputs.version }}" \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg \
            --title "${{ inputs.version }}" \
            --notes-file release-notes.md \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Delete tag on failure
        if: failure()
        run: git push origin --delete "${{ inputs.version }}" || true
